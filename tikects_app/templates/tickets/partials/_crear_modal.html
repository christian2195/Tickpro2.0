<div class="modal fade" id="modalCrearTicket" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="border-radius: var(--tp-rad-lg); border: 1px solid var(--tp-border-strong);">
            <div class="tp-modal-header p-4 d-flex justify-content-between align-items-center">
                <h5 class="modal-title tp-h3 m-0">Apertura de Ticket</h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="{% url 'crear_tikects' %}" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="modal-body p-4">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label tp-caption text-uppercase fw-bold">Servicio Requerido <span class="text-danger">*</span></label>
                            <select class="form-select tp-input" name="servicio" required>
                                <option value="" disabled selected>-- Elija categoría --</option>
                                {% for servicio in servicios %}
                                    <option value="{{ servicio.id }}">{{ servicio.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label tp-caption text-uppercase fw-bold">Unidad (Gerencia) <span class="text-danger">*</span></label>
                            <select class="form-select tp-input" name="gerencia" required>
                                <option value="" disabled selected>-- Ubicación --</option>
                                {% for gerencia in gerencias %}
                                    <option value="{{ gerencia.nombre }}">{{ gerencia.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label tp-caption text-uppercase fw-bold">Asunto Principal <span class="text-danger">*</span></label>
                        <input type="text" class="form-control tp-input" name="titulo" placeholder="Resumen corto del incidente" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label tp-caption text-uppercase fw-bold">Memoria Descriptiva <span class="text-danger">*</span></label>
                        <textarea class="form-control tp-input" name="descripcion" rows="5" placeholder="Detalle técnico u operativo..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Registrar e Iniciar Flujo</button>
                </div>
            </form>
        </div>
    </div>
</div>
